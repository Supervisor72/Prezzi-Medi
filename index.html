<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prezzi medi per reparto - DML</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--card:#161a22;--line:#232936;--in:#2a3140;--gold:#e8b84b;--g1:#b8860b;--g2:#c9971f;--ink:#e9ecf2;--mut:#8a93a6;--ok:#3ecf8e;--bad:#ef5350}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "DM Sans",Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.6rem;margin:0 0 4px;color:var(--gold)}
p.s{margin:0 0 20px;color:var(--mut)}
label{display:block;font-weight:700;margin:0 0 8px}
select,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--in);border-radius:8px;padding:12px}
input{font-family:"DM Mono",monospace}
select:focus,input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,184,75,.2)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.box{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px 12px;margin-bottom:16px}
.box::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--g1),var(--gold),var(--g2))}
.row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"nm cat" "in d";gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.nm{grid-area:nm;font-weight:700}
.cat{grid-area:cat;text-align:right;font:500 .9rem "DM Mono",monospace;color:var(--gold);background:rgba(232,184,75,.08);border:1px solid var(--line);border-radius:6px;padding:4px 10px;user-select:none;-webkit-user-select:none}
.cat i{font:normal .72rem "DM Sans",sans-serif;color:var(--mut);margin-right:6px}
.row input{grid-area:in}
.d{grid-area:d;text-align:right;min-width:80px;font:500 .95rem "DM Mono",monospace}
.ro{color:var(--mut);font-size:.85rem;margin:0 0 10px}
.up{color:var(--ok)}.dn{color:var(--bad)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
button{font:inherit;font-weight:700;border-radius:10px;padding:15px;cursor:pointer}
#ml{border:0;color:#0d0f14;background:linear-gradient(135deg,var(--gold),var(--g2) 60%,var(--g1))}
#tg{color:var(--gold);background:transparent;border:1.5px solid var(--gold)}
#msg{min-height:1.4em;margin-top:14px;font-weight:700}
</style></head><body><main>
<h1>Prezzi medi per reparto</h1>
<p class="s">Scegli il tuo PDV, inserisci i prezzi medi e invia.</p>
<div class="box"><label for="pdv">Punto vendita</label>
<select id="pdv"></select></div>
<div class="box"><div id="rows"></div></div>
<div class="acts"><button id="tg" type="button">Invia su Telegram</button><button id="ml" type="button">Invia via mail</button></div>
<div id="msg" role="status"></div>
</main>
<script>
// ===== CONFIGURAZIONE =====
const MAIL_TO="d.pavoni@dml-italia.com";
const TG_USERNAME="";   // tuo username Telegram, senza @ (se vuoto: il PDV sceglie il destinatario)
const REPARTI=["CLIMA","BIANCO","BRUNO","GRIGIO","INFORMATICA","MOBILITY","PED","TOTALE"];
const MEDIA_URL="https://script.google.com/macros/s/AKfycbwUinKg0_D1nv_1ZuUj2AzvO-DaX38hyebdi28AChlf6jEx3ZVmzPxW95iCtbjzKcg8/exec?action=media";      // link /exec dell'Apps Script Media Catena + ?action=media
const SHEET_CSV_URL="";  // link CSV "Pubblica sul web" del foglio Media Catena (se vuoto usa MEDIA_CATENA)
let MEDIA_CATENA={};   // es. {"TV":489.90,"Telefonia":312.50}  (dal file Excel)
const PDV=["FANO","MONSANO","OSIMO","MACERATA","CIVITANOVA","FOLIGNO","PESARO"];
// ==========================
const $=id=>document.getElementById(id);
const eur=n=>n.toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{const n=parseFloat(String(v).replace(/\./g,"").replace(",","."));return isNaN(n)?null:n};
$("pdv").innerHTML='<option value="">Seleziona...</option>'+PDV.map(p=>`<option>${p}</option>`).join("");
try{const s=localStorage.getItem("pdv");if(s)$("pdv").value=s}catch(e){}
$("pdv").onchange=()=>{try{localStorage.setItem("pdv",$("pdv").value)}catch(e){}};
$("rows").innerHTML='<p class="ro">La media catena è in sola lettura: la aggiorna la Direzione.</p>'+REPARTI.map((r,i)=>`<div class="row"><div class="nm">${r}</div><div class="cat" id="c${i}"><i>Media catena</i>-</div>
<input inputmode="decimal" placeholder="Il tuo prezzo €" data-i="${i}" aria-label="Prezzo medio ${r}"><div class="d" id="d${i}"></div></div>`).join("");
function delta(i){const r=REPARTI[i],inp=document.querySelector('#rows input[data-i="'+i+'"]'),v=num(inp.value),m=MEDIA_CATENA[r],el=$("d"+i);
 if(v==null||m==null){el.textContent="";return}
 const d=v-m;el.textContent=(d>=0?"+":"")+eur(d);el.className="d "+(d>=0?"up":"dn")}
function paintCat(){REPARTI.forEach((r,i)=>{const m=MEDIA_CATENA[r];$("c"+i).innerHTML="<i>Media catena</i>"+(m!=null?"€ "+eur(m):"-");delta(i)})}
document.querySelectorAll("#rows input").forEach(inp=>inp.oninput=()=>delta(inp.dataset.i));
async function loadCat(){
 if(MEDIA_URL){try{const j=await (await fetch(MEDIA_URL,{cache:"no-store"})).json();if(j.valori&&Object.keys(j.valori).length)MEDIA_CATENA=j.valori}catch(e){say("Media catena non aggiornata.",1)}}
 else if(SHEET_CSV_URL){try{const t=await (await fetch(SHEET_CSV_URL,{cache:"no-store"})).text();const M={};
  t.split(/\r?\n/).forEach(l=>{const c=l.match(/("([^"]*)"|[^,;]+)/g);if(!c||c.length<2)return;
   const n=c[0].replace(/"/g,"").trim().toLowerCase(),r=REPARTI.find(x=>x.toLowerCase()===n),v=num(c[1].replace(/"/g,"").replace("€",""));
   if(r&&v!=null)M[r]=v});
  if(Object.keys(M).length)MEDIA_CATENA=M}catch(e){say("Media catena non aggiornata: uso gli ultimi valori salvati.",1)}}
 paintCat()}
loadCat();
function build(){
 const p=$("pdv").value;if(!p){say("Seleziona il PDV.",1);return null}
 const L=[],miss=[];let n=0,calc=0;
 document.querySelectorAll("#rows input").forEach(inp=>{const v=num(inp.value);if(v==null)return;n++;
  const r=REPARTI[inp.dataset.i],m=MEDIA_CATENA[r];
  if(m==null){miss.push(r);return}
  const d=v-m;calc++;if(Math.round(d*100)<0)L.push(r+": -"+eur(Math.abs(d))+" €")});
 if(!n){say("Inserisci almeno un prezzo.",1);return null}
 if(!calc){say("Media catena non disponibile: impossibile calcolare la differenza.",1);return null}
 if(!L.length)L.push("Nessun reparto sotto la media catena.")
 return{p,t:"PREZZI MEDI REPARTO - "+p+" - "+new Date().toLocaleDateString("it-IT")+"\n\n"+L.join("\n")}}
function say(t,e){const m=$("msg");m.textContent=t;m.style.color=e?"var(--bad)":"var(--ok)"}
$("ml").onclick=()=>{const b=build();if(!b)return;
 location.href="mailto:"+MAIL_TO+"?subject="+encodeURIComponent("Prezzi medi reparto - "+b.p)+"&body="+encodeURIComponent(b.t);say("Mail pronta: premi Invia nella tua app di posta.")};
$("tg").onclick=async()=>{const b=build();if(!b)return;
 try{await navigator.clipboard.writeText(b.t)}catch(e){}
 const q=encodeURIComponent(b.t);
 const url=TG_USERNAME?"https://t.me/"+TG_USERNAME+"?text="+q:"https://t.me/share/url?url=%20&text="+q;
 window.open(url,"_blank");
 say(TG_USERNAME?"Telegram aperto con il messaggio pronto. Se non compare, incollalo: è già copiato.":"Telegram aperto con il messaggio pronto: scegli il destinatario e invia.")};
</script></body></html>
